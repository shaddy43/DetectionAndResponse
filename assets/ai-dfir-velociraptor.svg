<title id="t">An AI agent operating Velociraptor for DFIR</title>
<desc id="d">An AI agent connects over MCP to a Velociraptor server, which collects forensic artifacts from a fleet of Windows, Linux and macOS endpoints and returns evidence to the agent.</desc>

